; supervisor-nasande-worker.conf
; Worker de queue pour Nasande (enrichissement IA, commandes, e-mails).
; Cible : serveur de prod (mutualisé/Apache + MySQL + queue "database").
; Installation :
;   sudo cp deploy/supervisor-nasande-worker.conf /etc/supervisor/conf.d/nasande-worker.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status nasande-worker
;
; Si Supervisor n'est pas dispo (mutualisé strict), voir deploy/cron-worker.sh
; (lancé par cron toutes les minutes pour garantir un worker vivant).

[program:nasande-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /chemin/absolu/vers/nasande/artisan queue:work database --queue=default --tries=3 --max-time=3600 --sleep=3 --timeout=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/chemin/absolu/vers/nasande/storage/logs/worker.log
stopwaitsecs=30
